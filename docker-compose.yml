services:
  backend:
    build:
      context: ./backend
    container_name: gym-management-backend
    env_file:
      - ./backend/.env
    ports:
      - "3008:3008"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: gym-management-frontend
    environment:
      PUBLIC_API_URL: http://localhost:3008/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
